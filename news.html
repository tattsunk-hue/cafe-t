<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="海の見えるCafé Tの営業日や季節のメニューなど、最新のお知らせをご案内します。"
    />
    <title>お知らせ | 海の見えるCafé T</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/news.css" />
  </head>
  <body class="inner-page">
    <header class="site-header is-scrolled" data-header>
      <a class="site-logo" href="index.html" aria-label="Café T トップへ">Café T</a>
      <button
        class="menu-toggle"
        type="button"
        aria-label="メニューを開く"
        aria-controls="site-nav"
        aria-expanded="false"
        data-menu-toggle
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" id="site-nav" data-nav>
        <a href="news.html" aria-current="page">News</a>
        <a href="index.html#concept">Concept</a>
        <a href="index.html#menu">Menu</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="index.html#information">Information</a>
        <a href="index.html#access">Access</a>
      </nav>
    </header>

    <main class="news-page-main">
      <div class="news-page-container">
        <header class="news-page-heading">
          <p class="eyebrow">News</p>
          <h1>お知らせ</h1>
          <p class="news-description">
            営業日や季節のメニューなど、Café Tからの最新情報をご案内します。
          </p>
        </header>

        <div
          class="news-list news-list-page"
          data-news-list
          data-limit="100"
          aria-live="polite"
          aria-busy="true"
        >
          <p class="news-status" data-news-status>お知らせを読み込んでいます。</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div>
        <a class="footer-logo" href="index.html">Café T</a>
        <p>海を眺めて、<br />ほどける時間。</p>
      </div>
      <nav class="footer-nav" aria-label="フッターナビゲーション">
        <a href="news.html">News</a>
        <a href="index.html#concept">Concept</a>
        <a href="index.html#menu">Menu</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="index.html#information">Information</a>
        <a href="index.html#access">Access</a>
      </nav>
      <a class="instagram-link" href="#" aria-label="Café TのInstagramを見る">
        Instagram
      </a>
      <small>&copy; 2026 Café T. All rights reserved.</small>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/news.js"></script>
  </body>
</html>
