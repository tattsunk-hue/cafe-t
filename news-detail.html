<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="海の見えるCafé Tからのお知らせです。" />
    <title>お知らせ | 海の見えるCafé T</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/news.css" />
  </head>
  <body class="inner-page">
    <header class="site-header is-scrolled" data-header>
      <a class="site-logo" href="index.html" aria-label="Café T トップへ">Café T</a>
      <button
        class="menu-toggle"
        type="button"
        aria-label="メニューを開く"
        aria-controls="site-nav"
        aria-expanded="false"
        data-menu-toggle
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" id="site-nav" data-nav>
        <a href="news.html">News</a>
        <a href="index.html#concept">Concept</a>
        <a href="index.html#menu">Menu</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="index.html#information">Information</a>
        <a href="index.html#access">Access</a>
      </nav>
    </header>

    <main class="news-page-main">
      <article class="news-detail news-detail-loading" data-news-detail>
        <p class="news-status" data-news-detail-status aria-live="polite">
          お知らせを読み込んでいます。
        </p>
        <header class="news-detail-header" data-news-detail-header hidden>
          <time class="news-date" data-news-detail-date hidden></time>
          <h1 class="news-detail-title" data-news-detail-title hidden></h1>
        </header>
        <div class="news-detail-content" data-news-detail-content hidden></div>
        <a class="news-back-link" href="news.html">
          <span aria-hidden="true">←</span> お知らせ一覧へ戻る
        </a>
      </article>
    </main>

    <footer class="site-footer">
      <div>
        <a class="footer-logo" href="index.html">Café T</a>
        <p>海を眺めて、<br />ほどける時間。</p>
      </div>
      <nav class="footer-nav" aria-label="フッターナビゲーション">
        <a href="news.html">News</a>
        <a href="index.html#concept">Concept</a>
        <a href="index.html#menu">Menu</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="index.html#information">Information</a>
        <a href="index.html#access">Access</a>
      </nav>
      <a class="instagram-link" href="#" aria-label="Café TのInstagramを見る">
        Instagram
      </a>

    </footer>

    <script src="js/main.js"></script>
